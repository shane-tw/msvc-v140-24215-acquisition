version: "hostx64-targetx86-protobuf-{build}"

image: Visual Studio 2015
clone_depth: 1
skip_tags: true
test: off
deploy: off

branches:
  only:
    - hostx64-targetx86-protobuf-probe

environment:
  PROTOBUF_URL: https://github.com/protocolbuffers/protobuf/releases/download/v2.6.1/protobuf-2.6.1.tar.gz
  PROTOBUF_SIZE: 2641426
  PROTOBUF_SHA256: dbbd7bdd2381633995404de65a945ff1a7610b0da14593051b4738c90c6dd164
  MSP_SHA256: 6efde51cb390a21fe9b65e792fdc82b5e7e76fee883f7c5ea9a2a4cd78bf1483
  APPVEYOR_ARTIFACT_UPLOAD_TIMEOUT: 300

build_script:
  - ps: |
      Set-StrictMode -Version Latest
      $ErrorActionPreference = 'Stop'

      $buildRoot = $env:APPVEYOR_BUILD_FOLDER
      $work = Join-Path $buildRoot 'probe-work'
      $output = Join-Path $buildRoot 'probe-output'
      $qfeRoot = Join-Path $work 'qfe'
      $exactBin = Join-Path $work 'bin-exact-24215'
      $vcRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio 14.0\VC'
      $installedHostX64Bin = Join-Path $vcRoot 'bin\amd64_x86'
      $installedHostX64SupportBin = Join-Path $vcRoot 'bin\amd64'
      $installedHostX86Bin = Join-Path $vcRoot 'bin'
      New-Item -ItemType Directory -Force -Path $work, $output, $qfeRoot, $exactBin | Out-Null

      function Get-Sha256([string]$path) {
        return (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
      }

      function Assert-File([string]$path, [string]$expectedHash) {
        if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
          throw "missing file: $path"
        }
        $actual = Get-Sha256 $path
        if ($actual -ne $expectedHash.ToLowerInvariant()) {
          throw "hash mismatch: $path expected=$expectedHash actual=$actual"
        }
      }

      if (-not (Test-Path -LiteralPath $installedHostX64Bin -PathType Container)) {
        throw "installed HostX64.TargetX86 directory missing: $installedHostX64Bin"
      }
      if (-not (Test-Path -LiteralPath $installedHostX64SupportBin -PathType Container)) {
        throw "installed HostX64 support directory missing: $installedHostX64SupportBin"
      }
      if (-not (Test-Path -LiteralPath $installedHostX86Bin -PathType Container)) {
        throw "installed HostX86.TargetX86 directory missing: $installedHostX86Bin"
      }

      $mspCandidates = @(Get-ChildItem -LiteralPath 'C:\ProgramData\Package Cache' -Recurse -Force -File -Filter 'VC_VSU3.5.msp' |
        Where-Object { (Get-Sha256 $_.FullName) -eq $env:MSP_SHA256 })
      if ($mspCandidates.Count -ne 1) {
        throw "expected exactly one exact VC_VSU3.5.msp, found $($mspCandidates.Count)"
      }
      $msp = $mspCandidates[0]

      $qfeCab = Join-Path $qfeRoot 'QFE.cab'
      $streamExtractor = Join-Path $work 'extract_ole_stream.exe'
      $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
      $cscStdout = Join-Path $output 'stream-extractor-build.stdout.txt'
      $cscStderr = Join-Path $output 'stream-extractor-build.stderr.txt'
      $cscProcess = Start-Process -FilePath $csc -ArgumentList @('/nologo', '/target:exe', "/out:$streamExtractor", (Join-Path $buildRoot 'extract_ole_stream.cs')) `
        -NoNewWindow -Wait -PassThru -RedirectStandardOutput $cscStdout -RedirectStandardError $cscStderr
      if ($cscProcess.ExitCode -ne 0) {
        Get-Content -LiteralPath $cscStdout, $cscStderr | Write-Host
        throw "OLE stream extractor build failed: $($cscProcess.ExitCode)"
      }
      $streamStdout = Join-Path $output 'msp-stream-extract.stdout.txt'
      $streamStderr = Join-Path $output 'msp-stream-extract.stderr.txt'
      $streamProcess = Start-Process -FilePath $streamExtractor -ArgumentList @("`"$($msp.FullName)`"", '56267877', "`"$qfeCab`"") `
        -NoNewWindow -Wait -PassThru -RedirectStandardOutput $streamStdout -RedirectStandardError $streamStderr
      if ($streamProcess.ExitCode -ne 0) {
        Get-Content -LiteralPath $streamStdout, $streamStderr | Write-Host
        throw "OLE stream extraction failed: $($streamProcess.ExitCode)"
      }
      Assert-File $qfeCab '2e0c7bcd88f6f6b287886d7f4dbe486ba2eca6d23780301fd5296e9341ed1a02'
      & (Join-Path $env:SystemRoot 'System32\expand.exe') '-F:*' $qfeCab $qfeRoot |
        Out-File (Join-Path $output 'qfe-cab-expand.log') -Encoding ASCII
      if ($LASTEXITCODE -ne 0) { throw "QFE CAB expansion failed: $LASTEXITCODE" }

      $exactFiles = @{
        'cl.exe'   = @('cl.exe_ulq14AuEiVH97whYwRBgcIeYNeE_x86', '704075ca34bc6b7b5fe3e279292acf4c7e5a21dc3fc5d1f1c191ad500e79e747')
        'c1.dll'   = @('c1.dll_4fRTQDjKiHKFPHMoFa5aqR1hk0c_x86', 'cf88c26eed1a70788a7fe2b78d4bb3d9def94ca87716c72c4f2d35c9564dc74d')
        'c1xx.dll' = @('c1xx.dll_BDmHYZpxuRVGbTn7XtbFWblwyT8_x86', '5900e2c74eefa10299af0a9ed353be098c2a9e68d4bf23f4ad4a92a67e84b0e8')
        'c2.dll'   = @('c2.dll_fSDnGQXz1mgBc4yQD2fwyarv5bk_x86', '3b258914ea4da54361a6b8a8bda7d2baae2242d7c389234d8828bca9842b81b9')
        'link.exe' = @('link.exe_tA26bFI2T4xoXiwDEoXkSP3oMdo_x86', '27cc8f739d0f592a4b5a2f3085ac64fca84cad7bf58e9796ba159701ac40abd2')
      }
      Copy-Item -Path (Join-Path $installedHostX64SupportBin '*') -Destination $exactBin -Recurse -Force
      Copy-Item -Path (Join-Path $installedHostX64Bin '*') -Destination $exactBin -Recurse -Force
      foreach ($installedName in $exactFiles.Keys) {
        $source = Join-Path $qfeRoot $exactFiles[$installedName][0]
        Assert-File $source $exactFiles[$installedName][1]
        Copy-Item -LiteralPath $source -Destination (Join-Path $exactBin $installedName) -Force
      }

      $sevenZip = (Get-Command '7z.exe' -ErrorAction Stop).Source
      $sourceArchive = Join-Path $work 'protobuf-2.6.1.tar.gz'
      Invoke-WebRequest -UseBasicParsing -Uri $env:PROTOBUF_URL -OutFile $sourceArchive
      if ((Get-Item -LiteralPath $sourceArchive).Length -ne [int64]$env:PROTOBUF_SIZE) {
        throw "protobuf archive size mismatch"
      }
      Assert-File $sourceArchive $env:PROTOBUF_SHA256
      $sourceExtract = Join-Path $work 'source'
      New-Item -ItemType Directory -Force -Path $sourceExtract | Out-Null
      & $sevenZip x -y "-o$sourceExtract" $sourceArchive | Out-File (Join-Path $output 'protobuf-gzip-extract.log') -Encoding ASCII
      if ($LASTEXITCODE -ne 0) { throw "protobuf gzip extraction failed: $LASTEXITCODE" }
      $sourceTar = Get-ChildItem -LiteralPath $sourceExtract -File -Filter '*.tar' | Select-Object -First 1
      if ($null -eq $sourceTar) { throw "protobuf tar payload missing" }
      & $sevenZip x -y "-o$sourceExtract" $sourceTar.FullName | Out-File (Join-Path $output 'protobuf-tar-extract.log') -Encoding ASCII
      if ($LASTEXITCODE -ne 0) { throw "protobuf tar extraction failed: $LASTEXITCODE" }
      $sourceRoot = Join-Path $sourceExtract 'protobuf-2.6.1'
      Assert-File (Join-Path $sourceRoot 'src\google\protobuf\descriptor.cc') '663b30b849721f0dc589f1e9b9db7b092f9b2d839ad16ad44292fd4646b4cf0d'

      $vcInclude = Join-Path $vcRoot 'include'
      $vcHeaderGates = @{
        'algorithm'     = '674f0dddc61283e68e4f49c6dbb92628c90ac8a0dabb094f59a7d9b1442b4d3b'
        'xutility'      = '20c8f017d72895f5b8c251facc96244b5369bab0cdc7cb43ae14101bbcb5e6a9'
        'vector'        = 'a22d2c4b932d7eb8176070e6f6b17345bbefee627b22d62993a59ffa64b1d0dc'
        'list'          = 'a27587db203af15111db9eb64d3a14d5d065190bc819ddd96713793c750d993c'
        'unordered_map' = '400b5005651b7760be7d02dc193fd5097e74eb32cc14f294cadc6da74a19e38d'
        'xstring'       = '0bec7a1d06de7845e457766311e882a65bb6bd0b32b22aab952f458f5931b6a7'
        'type_traits'   = 'c20abfc0c990d92bd7ab4419b1138c28d3119737abced8e6c1f4f8c8238d0f76'
      }
      foreach ($name in $vcHeaderGates.Keys) {
        Assert-File (Join-Path $vcInclude $name) $vcHeaderGates[$name]
      }

      $ucrtHeaderGates = @{
        'corecrt.h' = '147464f55b954fe5a2033353b95fdf11dbe96274e07baa77d90a6744c94141c6'
        'stdio.h'   = '9dc21bcf6caf69f4d82c6a609801e0ddf4e8e739447da83d3207d36f8ca6878d'
        'stdlib.h'  = '44b607c55c32d5b8ea1d86278e5f7d2daf1849ef5f01c6e06026efd3e6d93e2d'
        'string.h'  = '085e5e11ff47a58d97927a96ff63dce7a66e9fb0d270988369daaac17da6b3a9'
        'math.h'    = '1219188bde640067374ace8119637dc004c7529913f80f26962e834a0895af6c'
        'time.h'    = 'b70a2d9a8b1a89e88dfcce1ccd65c0fc4844bc1ecd2b2936cde66fcc2d422ef5'
      }
      $ucrtMatches = New-Object 'System.Collections.Generic.List[string]'
      $ucrtRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
      foreach ($versionDirectory in @(Get-ChildItem -LiteralPath $ucrtRoot -Directory -ErrorAction Stop)) {
        $candidate = Join-Path $versionDirectory.FullName 'ucrt'
        if (-not (Test-Path -LiteralPath $candidate -PathType Container)) { continue }
        $match = $true
        foreach ($name in $ucrtHeaderGates.Keys) {
          $path = Join-Path $candidate $name
          if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Sha256 $path) -ne $ucrtHeaderGates[$name]) {
            $match = $false
          }
        }
        if ($match) { $ucrtMatches.Add($candidate) }
      }
      if ($ucrtMatches.Count -lt 1) { throw "no installed UCRT header set matches the frozen recipe" }
      $ucrtInclude = @($ucrtMatches | Sort-Object)[0]

      function Capture-Banner([string]$label, [string]$compiler) {
        $stdout = Join-Path $output "$label-banner-stdout.txt"
        $stderr = Join-Path $output "$label-banner-stderr.txt"
        $process = Start-Process -FilePath $compiler -ArgumentList '/?' -NoNewWindow -Wait -PassThru `
          -RedirectStandardOutput $stdout -RedirectStandardError $stderr
        if ($process.ExitCode -ne 0) { throw "$label compiler banner failed: $($process.ExitCode)" }
        $banner = ((Get-Content -LiteralPath $stdout -Raw) + "`n" + (Get-Content -LiteralPath $stderr -Raw))
        $match = [regex]::Match($banner, 'Version\s+([0-9.]+)\s+for\s+([^\s]+)')
        if (-not $match.Success) { throw "$label compiler banner did not parse" }
        return [pscustomobject]@{ version = $match.Groups[1].Value; target = $match.Groups[2].Value }
      }

      function Compile-Descriptor([string]$label, [string]$binDirectory, [string]$expectedVersion) {
        $variant = Join-Path $output $label
        New-Item -ItemType Directory -Force -Path $variant | Out-Null
        $compiler = Join-Path $binDirectory 'cl.exe'
        $identity = Capture-Banner $label $compiler
        $normalizedBanner = (($identity.version.Split('.') | ForEach-Object { [int]$_ }) -join '.')
        if ($normalizedBanner -ne $expectedVersion -or $identity.target -ne 'x86') {
          throw "$label unexpected compiler identity: $($identity.version) for $($identity.target)"
        }
        $pdb = Join-Path $variant 'libprotobuf.pdb'
        $object = Join-Path $variant 'descriptor.obj'
        $rsp = Join-Path $variant 'descriptor.rsp'
        $arguments = @(
          '/c',
          '/X',
          "/I`"$sourceRoot\src`"",
          "/I`"$sourceRoot\vsprojects`"",
          "/I`"$vcInclude`"",
          "/I`"$ucrtInclude`"",
          '/nologo',
          '/W3',
          '/WX-',
          '/O2',
          '/Ob2',
          '/D WIN32',
          '/D NDEBUG',
          '/D _WINDOWS',
          '/D _USRDLL',
          '/D LIBPROTOBUF_EXPORTS',
          '/D _MBCS',
          '/D _SILENCE_STDEXT_HASH_DEPRECATION_WARNINGS',
          '/D _ALLOW_RUNTIME_LIBRARY_MISMATCH',
          '/GF',
          '/Gm-',
          '/EHsc',
          '/MT',
          '/GS',
          '/Gy',
          '/fp:precise',
          '/Zc:wchar_t',
          '/Zc:forScope',
          '/Zc:inline',
          '/GR',
          '/Zi',
          "/Fd`"$pdb`"",
          "/Fo`"$object`"",
          '/Gd',
          '/TP',
          '/wd4244',
          '/wd4267',
          '/wd4018',
          '/wd4355',
          '/wd4800',
          '/wd4251',
          '/wd4996',
          '/wd4146',
          '/wd4305',
          "`"$sourceRoot\src\google\protobuf\descriptor.cc`""
        )
        [System.IO.File]::WriteAllLines($rsp, $arguments, [System.Text.Encoding]::ASCII)
        $stdout = Join-Path $variant 'descriptor-compile.stdout.txt'
        $stderr = Join-Path $variant 'descriptor-compile.stderr.txt'
        $process = Start-Process -FilePath $compiler -ArgumentList "@$rsp" -WorkingDirectory $binDirectory `
          -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
        $process.ExitCode | Set-Content -LiteralPath (Join-Path $variant 'descriptor-compile.exit') -Encoding ASCII
        if ($process.ExitCode -ne 0) { throw "$label descriptor compile failed: $($process.ExitCode)" }
        if ((Get-Item -LiteralPath $object).Length -le 0) { throw "$label descriptor object is empty" }

        $compile3 = Join-Path $variant 'compile3.json'
        & python (Join-Path $buildRoot 'parse_compile3.py') $object | Set-Content -LiteralPath $compile3 -Encoding ASCII
        if ($LASTEXITCODE -ne 0) { throw "$label S_COMPILE3 parse failed: $LASTEXITCODE" }
        $compileRows = @(Get-Content -LiteralPath $compile3 -Raw | ConvertFrom-Json)
        if ($compileRows.Count -ne 1 -or $compileRows[0].frontend -ne $expectedVersion -or $compileRows[0].backend -ne $expectedVersion) {
          throw "$label S_COMPILE3 mismatch"
        }

        $fileRows = foreach ($name in @('cl.exe', 'c1.dll', 'c1xx.dll', 'c2.dll')) {
          $path = Join-Path $binDirectory $name
          [pscustomobject]@{ name = $name; size = (Get-Item -LiteralPath $path).Length; sha256 = Get-Sha256 $path }
        }
        [pscustomobject]@{
          label = $label
          banner_version = $identity.version
          target = $identity.target
          object_size = (Get-Item -LiteralPath $object).Length
          object_sha256 = Get-Sha256 $object
          pdb_size = (Get-Item -LiteralPath $pdb).Length
          pdb_sha256 = Get-Sha256 $pdb
          compiler_files = @($fileRows)
          compile3 = @($compileRows)
        } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $variant 'identity.json') -Encoding UTF8
      }

      Compile-Descriptor 'hostx64-targetx86-24215' $exactBin '19.0.24215.1'
      Compile-Descriptor 'hostx64-targetx86-24241' $installedHostX64Bin '19.0.24241.7'
      Compile-Descriptor 'hostx86-targetx86-24241' $installedHostX86Bin '19.0.24241.7'

      Get-ChildItem -LiteralPath $output -Recurse -File -Filter '*.pdb' | Remove-Item -Force

      [pscustomobject]@{
        image = $env:APPVEYOR_BUILD_WORKER_IMAGE
        build_id = $env:APPVEYOR_BUILD_ID
        job_id = $env:APPVEYOR_JOB_ID
        commit = $env:APPVEYOR_REPO_COMMIT
        protobuf_url = $env:PROTOBUF_URL
        protobuf_size = (Get-Item -LiteralPath $sourceArchive).Length
        protobuf_sha256 = Get-Sha256 $sourceArchive
        msp_path = $msp.FullName
        msp_size = $msp.Length
        msp_sha256 = Get-Sha256 $msp.FullName
        vc_include = $vcInclude
        ucrt_include = $ucrtInclude
        ucrt_matching_sets = @($ucrtMatches)
      } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $output 'provenance.json') -Encoding UTF8

      $outputPrefix = $output.TrimEnd('\') + '\'
      Get-ChildItem -LiteralPath $output -Recurse -File |
        Sort-Object FullName |
        ForEach-Object {
          $relative = $_.FullName.Substring($outputPrefix.Length)
          "$relative`t$($_.Length)`t$(Get-Sha256 $_.FullName)"
        } | Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS.tsv') -Encoding ASCII

artifacts:
  - path: probe-output
    name: hostx64-targetx86-protobuf-probe
    type: zip
