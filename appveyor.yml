version: "v140-msp-probe-{build}"

image: Visual Studio 2015
clone_depth: 1
skip_tags: true
test: off
deploy: off

environment:
  EXPECTED_MSVC_BANNER: 19.00.24215.1
  EXPECTED_VC_VSU3_MSP_SHA1: 0635238754D5A8C38FE9BAF41296C1E0C8DA49B1
  EXPECTED_VC_VSU3_MSP_SIZE: 75481088

build_script:
  - ps: |
      Set-StrictMode -Version Latest
      $ErrorActionPreference = 'Stop'

      $buildRoot = $env:APPVEYOR_BUILD_FOLDER
      $captureRoot = Join-Path $buildRoot 'capture-root'
      $metadataRoot = Join-Path $buildRoot 'capture-metadata'
      $vcRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio 14.0\VC'
      $packageCacheRoot = 'C:\ProgramData\Package Cache'
      New-Item -ItemType Directory -Force -Path $captureRoot, $metadataRoot | Out-Null

      function Get-CompilerIdentity {
        param(
          [Parameter(Mandatory = $true)][string]$Compiler,
          [Parameter(Mandatory = $true)][string]$Label
        )

        if (-not (Test-Path -LiteralPath $Compiler -PathType Leaf)) {
          throw "Missing $Label compiler: $Compiler"
        }

        # cl.exe writes its banner to stderr and exits non-zero with no input.
        # Redirect inside cmd.exe so ErrorActionPreference cannot hide it.
        $commandLine = ('""{0}" 2>&1"' -f $Compiler)
        $banner = (& cmd.exe /d /s /c $commandLine | Out-String).Trim()
        $banner | Set-Content -LiteralPath (Join-Path $metadataRoot "$Label-banner.txt") -Encoding ASCII

        $match = [regex]::Match($banner, 'Version\s+([0-9.]+)\s+for\s+([^\s]+)')
        if (-not $match.Success) {
          throw "Could not parse $Label compiler banner: $banner"
        }

        $item = Get-Item -LiteralPath $Compiler
        $sha256 = (Get-FileHash -LiteralPath $Compiler -Algorithm SHA256).Hash.ToLowerInvariant()
        $signature = Get-AuthenticodeSignature -LiteralPath $Compiler
        [pscustomobject]@{
          label = $Label
          path = $Compiler
          banner_version = $match.Groups[1].Value
          target = $match.Groups[2].Value
          expected_version = $env:EXPECTED_MSVC_BANNER
          expected_version_match = ($match.Groups[1].Value -eq $env:EXPECTED_MSVC_BANNER)
          size = $item.Length
          sha256 = $sha256
          file_version = $item.VersionInfo.FileVersion
          product_version = $item.VersionInfo.ProductVersion
          signature_status = $signature.Status.ToString()
          signer = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { $null }
        }
      }

      $x86Cl = Join-Path $vcRoot 'bin\cl.exe'
      $amd64Cl = Join-Path $vcRoot 'bin\amd64\cl.exe'
      if (-not (Test-Path -LiteralPath $amd64Cl -PathType Leaf)) {
        $amd64Cl = Join-Path $vcRoot 'bin\x86_amd64\cl.exe'
      }
      $compilerIdentities = @(
        Get-CompilerIdentity -Compiler $x86Cl -Label 'x86'
        Get-CompilerIdentity -Compiler $amd64Cl -Label 'amd64'
      )
      $compilerIdentities | ConvertTo-Json -Depth 5 |
        Set-Content -LiteralPath (Join-Path $metadataRoot 'compiler-identities.json') -Encoding UTF8

      @(
        "os_version=$([System.Environment]::OSVersion.VersionString)",
        "is_64_bit_os=$([System.Environment]::Is64BitOperatingSystem)",
        "powershell_version=$($PSVersionTable.PSVersion.ToString())"
      ) | Set-Content -LiteralPath (Join-Path $metadataRoot 'worker-os.txt') -Encoding ASCII
      @(
        "APPVEYOR_BUILD_WORKER_IMAGE=$env:APPVEYOR_BUILD_WORKER_IMAGE",
        "APPVEYOR_BUILD_ID=$env:APPVEYOR_BUILD_ID",
        "APPVEYOR_JOB_ID=$env:APPVEYOR_JOB_ID",
        "APPVEYOR_BUILD_VERSION=$env:APPVEYOR_BUILD_VERSION",
        "APPVEYOR_REPO_COMMIT=$env:APPVEYOR_REPO_COMMIT"
      ) | Set-Content -LiteralPath (Join-Path $metadataRoot 'appveyor-environment.txt') -Encoding ASCII

      function Copy-PackageCacheFile {
        param([Parameter(Mandatory = $true)][string]$Source)
        $cachePrefix = $packageCacheRoot.TrimEnd('\') + '\'
        if (-not $Source.StartsWith($cachePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
          throw "Package Cache path escaped its root: $Source"
        }
        $relative = $Source.Substring($cachePrefix.Length)
        $destination = Join-Path (Join-Path $captureRoot 'PackageCache') $relative
        New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
        Copy-Item -LiteralPath $Source -Destination $destination -Force
      }

      $expectedSha1 = $env:EXPECTED_VC_VSU3_MSP_SHA1.ToUpperInvariant()
      $expectedSize = [int64]$env:EXPECTED_VC_VSU3_MSP_SIZE
      $mspRows = New-Object 'System.Collections.Generic.List[object]'
      $selectedPaths = New-Object 'System.Collections.Generic.HashSet[string]' ([System.StringComparer]::OrdinalIgnoreCase)
      if (Test-Path -LiteralPath $packageCacheRoot -PathType Container) {
        Get-ChildItem -LiteralPath $packageCacheRoot -Recurse -File -Filter '*.msp' -ErrorAction SilentlyContinue |
          Sort-Object FullName |
          ForEach-Object {
            $sha1 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA1).Hash.ToUpperInvariant()
            $sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $exactHash = ($sha1 -eq $expectedSha1)
            $exactSize = ($_.Length -eq $expectedSize)
            $namedCandidate = ($_.FullName -match '(?i)VC[_-]?VSU3|KB3165756|14[.]0[.](24215|25425)')
            $selected = $exactHash -or $namedCandidate
            $mspRows.Add([pscustomobject]@{
              path = $_.FullName
              size = $_.Length
              sha1 = $sha1
              sha256 = $sha256
              expected_sha1_match = $exactHash
              expected_size_match = $exactSize
              named_candidate = $namedCandidate
              selected = $selected
            })
            if ($selected) {
              [void]$selectedPaths.Add($_.FullName)
              Copy-PackageCacheFile -Source $_.FullName
              Get-ChildItem -LiteralPath $_.DirectoryName -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Length -lt 50MB -and $_.Extension -match '(?i)^\.(xml|json|manifest|txt|ini|rsm)$' } |
                ForEach-Object {
                  [void]$selectedPaths.Add($_.FullName)
                  Copy-PackageCacheFile -Source $_.FullName
                }
            }
          }
      }
      $mspRows | ConvertTo-Json -Depth 5 |
        Set-Content -LiteralPath (Join-Path $metadataRoot 'package-cache-msp.json') -Encoding UTF8

      $exactMatches = @($mspRows | Where-Object { $_.expected_sha1_match })
      $namedMatches = @($mspRows | Where-Object { $_.named_candidate })
      [pscustomobject]@{
        expected_sha1 = $expectedSha1
        expected_size = $expectedSize
        expected_payload_found = ($exactMatches.Count -gt 0)
        expected_payload_count = $exactMatches.Count
        expected_payload_size_valid = ($exactMatches.Count -gt 0 -and @($exactMatches | Where-Object { -not $_.expected_size_match }).Count -eq 0)
        named_candidate_count = $namedMatches.Count
        total_msp_count = $mspRows.Count
        selected_file_count = $selectedPaths.Count
        installed_compiler_is_expected = (@($compilerIdentities | Where-Object { -not $_.expected_version_match }).Count -eq 0)
      } | ConvertTo-Json |
        Set-Content -LiteralPath (Join-Path $metadataRoot 'RESULT.json') -Encoding UTF8

      $metadataPrefix = $metadataRoot.TrimEnd('\') + '\'
      Get-ChildItem -LiteralPath $metadataRoot -Recurse -File |
        Sort-Object FullName |
        ForEach-Object {
          $relative = $_.FullName.Substring($metadataPrefix.Length)
          "$relative`t$($_.Length)`t$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
        } | Set-Content -LiteralPath (Join-Path $metadataRoot 'SHA256SUMS.tsv') -Encoding ASCII

artifacts:
  - path: capture-metadata
    name: v140-msp-probe-metadata
    type: zip
  - path: capture-root
    name: v140-msp-probe-selected-payloads
    type: zip
