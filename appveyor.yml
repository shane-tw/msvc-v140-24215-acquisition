version: "mfc-24213-probe-{build}"

image:
  - Visual Studio 2015
  - Visual Studio 2017
  - Visual Studio 2019

clone_depth: 1
skip_tags: true
test: off
deploy: off

branches:
  only:
    - mfc-24213-probe

matrix:
  fast_finish: false

environment:
  TARGET_BUILD: 24213
  CAPTURE_BYTE_CAP: 1073741824
  APPVEYOR_ARTIFACT_UPLOAD_TIMEOUT: 1200

build_script:
  - ps: '& (Join-Path $env:APPVEYOR_BUILD_FOLDER "probe_mfc.ps1")'

artifacts:
  - path: capture-metadata
    name: mfc-24213-probe-metadata
    type: zip
  - path: capture-root
    name: mfc-24213-probe-selected-payloads
    type: zip
