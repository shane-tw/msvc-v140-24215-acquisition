version: "mfc-24213-capture-{build}"

image: Visual Studio 2015
clone_depth: 1
skip_tags: true
test: off
deploy: off

branches:
  only:
    - mfc-24213-capture

environment:
  APPVEYOR_ARTIFACT_UPLOAD_TIMEOUT: 1200

build_script:
  - ps: |
      Set-StrictMode -Version Latest
      $ErrorActionPreference = 'Stop'

      $buildRoot = $env:APPVEYOR_BUILD_FOLDER
      $captureRoot = Join-Path $buildRoot 'capture-root'
      $metadataRoot = Join-Path $buildRoot 'capture-metadata'
      $cacheRoot = 'C:\ProgramData\Package Cache'
      $cachePrefix = $cacheRoot.TrimEnd('\') + '\'
      New-Item -ItemType Directory -Force -Path $captureRoot, $metadataRoot | Out-Null

      # KB3165756 ships VC_MFC.X86/X64/MBCS as full MSI packages at 14.0.24213; Burn caches
      # them under {ProductCode}v14.0.24213 with their external cabinets.
      $productCodes = @(
        '{5D0FA3E6-0A32-37C1-96CD-4E9DFF785FC0}'
        '{45BA717B-9F10-3553-B582-2D1156747046}'
        '{C1C8E6C3-F739-36C3-A02B-1DED2EE23766}'
      )
      Get-ChildItem -LiteralPath $cacheRoot -Force -Directory | Sort-Object Name |
        ForEach-Object { $_.Name } | Set-Content -LiteralPath (Join-Path $metadataRoot 'package-cache-dirs.txt') -Encoding ASCII
      Write-Host "top-level cache directories: $(@(Get-ChildItem -LiteralPath $cacheRoot -Force -Directory).Count)"

      $selectedDirs = @(Get-ChildItem -LiteralPath $cacheRoot -Force -Directory | Where-Object {
        $name = $_.Name
        ($name -match '(?<![0-9])24213(?![0-9])') -or (@($productCodes | Where-Object { $name.StartsWith($_, [System.StringComparison]::OrdinalIgnoreCase) }).Count -gt 0)
      })
      Write-Host "directories matched by name: $($selectedDirs.Count)"
      $mfcFiles = @(Get-ChildItem -LiteralPath $cacheRoot -Recurse -Force -File -ErrorAction SilentlyContinue |
        Where-Object { $_.FullName.Substring($cachePrefix.Length) -match '(?i)VC_MFC' })
      Write-Host "files under VC_MFC paths: $($mfcFiles.Count)"

      $files = @(@($selectedDirs | ForEach-Object { Get-ChildItem -LiteralPath $_.FullName -Recurse -Force -File }) + $mfcFiles |
        Sort-Object FullName -Unique)
      $rows = foreach ($file in $files) {
        $relative = $file.FullName.Substring($cachePrefix.Length)
        $destination = Join-Path (Join-Path $captureRoot 'PackageCache') $relative
        New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
        Copy-Item -LiteralPath $file.FullName -Destination $destination -Force
        $sha1 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA1).Hash
        Write-Host "captured $relative $($file.Length) $sha1"
        "$relative`t$($file.Length)`t$sha1`t$((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
      }
      @($rows) | Set-Content -LiteralPath (Join-Path $metadataRoot 'captured.tsv') -Encoding ASCII
      "APPVEYOR_BUILD_WORKER_IMAGE=$env:APPVEYOR_BUILD_WORKER_IMAGE", "APPVEYOR_JOB_ID=$env:APPVEYOR_JOB_ID",
        "APPVEYOR_REPO_COMMIT=$env:APPVEYOR_REPO_COMMIT" |
        Set-Content -LiteralPath (Join-Path $metadataRoot 'worker.txt') -Encoding ASCII
      if ($files.Count -eq 0) {
        'no files captured' | Set-Content -LiteralPath (Join-Path $captureRoot 'EMPTY.txt') -Encoding ASCII
      }

artifacts:
  - path: capture-metadata
    name: mfc-24213-capture-metadata
    type: zip
  - path: capture-root
    name: mfc-24213-capture-payloads
    type: zip
