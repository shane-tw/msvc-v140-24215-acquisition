version: "exact24215-full-valve-archive-{build}"

image: Visual Studio 2015
clone_depth: 1
skip_tags: true
test: off
deploy: off

branches:
  only:
    - converted-vcproj-protobuf-probe

environment:
  PROTOBUF_URL: https://github.com/protocolbuffers/protobuf/releases/download/v2.6.1/protobuf-2.6.1.tar.gz
  PROTOBUF_SIZE: 2641426
  PROTOBUF_SHA256: dbbd7bdd2381633995404de65a945ff1a7610b0da14593051b4738c90c6dd164
  VALVE_SOURCE_COMMIT: c22529f725414dbb857ace0f170013ab32d35fff
  MSP_SHA256: 6efde51cb390a21fe9b65e792fdc82b5e7e76fee883f7c5ea9a2a4cd78bf1483
  APPVEYOR_ARTIFACT_UPLOAD_TIMEOUT: 300

build_script:
  - ps: |
      Set-StrictMode -Version Latest
      $ErrorActionPreference = 'Stop'

      $buildRoot = $env:APPVEYOR_BUILD_FOLDER
      $work = Join-Path $buildRoot 'probe-work'
      $output = Join-Path $buildRoot 'probe-output'
      $qfeRoot = Join-Path $work 'qfe'
      $exactBin = Join-Path $work 'bin-exact-24215'
      $currentHostX64Bin = Join-Path $work 'bin-current-hostx64-24241'
      $vcRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio 14.0\VC'
      $installedHostX64Bin = Join-Path $vcRoot 'bin\amd64_x86'
      $installedHostX64SupportBin = Join-Path $vcRoot 'bin\amd64'
      $installedHostX86Bin = Join-Path $vcRoot 'bin'
      New-Item -ItemType Directory -Force -Path $work, $output, $qfeRoot, $exactBin, $currentHostX64Bin | Out-Null

      function Get-Sha256([string]$path) {
        return (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
      }

      function Assert-File([string]$path, [string]$expectedHash) {
        if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
          throw "missing file: $path"
        }
        $actual = Get-Sha256 $path
        if ($actual -ne $expectedHash.ToLowerInvariant()) {
          throw "hash mismatch: $path expected=$expectedHash actual=$actual"
        }
      }

      if (-not (Test-Path -LiteralPath $installedHostX64Bin -PathType Container)) {
        throw "installed HostX64.TargetX86 directory missing: $installedHostX64Bin"
      }
      if (-not (Test-Path -LiteralPath $installedHostX64SupportBin -PathType Container)) {
        throw "installed HostX64 support directory missing: $installedHostX64SupportBin"
      }
      if (-not (Test-Path -LiteralPath $installedHostX86Bin -PathType Container)) {
        throw "installed HostX86.TargetX86 directory missing: $installedHostX86Bin"
      }

      $mspCandidates = @(Get-ChildItem -LiteralPath 'C:\ProgramData\Package Cache' -Recurse -Force -File -Filter 'VC_VSU3.5.msp' |
        Where-Object { (Get-Sha256 $_.FullName) -eq $env:MSP_SHA256 })
      if ($mspCandidates.Count -ne 1) {
        throw "expected exactly one exact VC_VSU3.5.msp, found $($mspCandidates.Count)"
      }
      $msp = $mspCandidates[0]

      $qfeCab = Join-Path $qfeRoot 'QFE.cab'
      $streamExtractor = Join-Path $work 'extract_ole_stream.exe'
      $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
      $cscStdout = Join-Path $output 'stream-extractor-build.stdout.txt'
      $cscStderr = Join-Path $output 'stream-extractor-build.stderr.txt'
      $cscProcess = Start-Process -FilePath $csc -ArgumentList @('/nologo', '/target:exe', "/out:$streamExtractor", (Join-Path $buildRoot 'extract_ole_stream.cs')) `
        -NoNewWindow -Wait -PassThru -RedirectStandardOutput $cscStdout -RedirectStandardError $cscStderr
      if ($cscProcess.ExitCode -ne 0) {
        Get-Content -LiteralPath $cscStdout, $cscStderr | Write-Host
        throw "OLE stream extractor build failed: $($cscProcess.ExitCode)"
      }
      $streamStdout = Join-Path $output 'msp-stream-extract.stdout.txt'
      $streamStderr = Join-Path $output 'msp-stream-extract.stderr.txt'
      $streamProcess = Start-Process -FilePath $streamExtractor -ArgumentList @("`"$($msp.FullName)`"", '56267877', "`"$qfeCab`"") `
        -NoNewWindow -Wait -PassThru -RedirectStandardOutput $streamStdout -RedirectStandardError $streamStderr
      if ($streamProcess.ExitCode -ne 0) {
        Get-Content -LiteralPath $streamStdout, $streamStderr | Write-Host
        throw "OLE stream extraction failed: $($streamProcess.ExitCode)"
      }
      Assert-File $qfeCab '2e0c7bcd88f6f6b287886d7f4dbe486ba2eca6d23780301fd5296e9341ed1a02'
      & (Join-Path $env:SystemRoot 'System32\expand.exe') '-F:*' $qfeCab $qfeRoot |
        Out-File (Join-Path $output 'qfe-cab-expand.log') -Encoding ASCII
      if ($LASTEXITCODE -ne 0) { throw "QFE CAB expansion failed: $LASTEXITCODE" }

      $exactFiles = @{
        'cl.exe'   = @('cl.exe_ulq14AuEiVH97whYwRBgcIeYNeE_x86', '704075ca34bc6b7b5fe3e279292acf4c7e5a21dc3fc5d1f1c191ad500e79e747')
        'c1.dll'   = @('c1.dll_4fRTQDjKiHKFPHMoFa5aqR1hk0c_x86', 'cf88c26eed1a70788a7fe2b78d4bb3d9def94ca87716c72c4f2d35c9564dc74d')
        'c1xx.dll' = @('c1xx.dll_BDmHYZpxuRVGbTn7XtbFWblwyT8_x86', '5900e2c74eefa10299af0a9ed353be098c2a9e68d4bf23f4ad4a92a67e84b0e8')
        'c2.dll'   = @('c2.dll_fSDnGQXz1mgBc4yQD2fwyarv5bk_x86', '3b258914ea4da54361a6b8a8bda7d2baae2242d7c389234d8828bca9842b81b9')
        'link.exe' = @('link.exe_tA26bFI2T4xoXiwDEoXkSP3oMdo_x86', '27cc8f739d0f592a4b5a2f3085ac64fca84cad7bf58e9796ba159701ac40abd2')
      }
      Copy-Item -Path (Join-Path $installedHostX64SupportBin '*') -Destination $currentHostX64Bin -Recurse -Force
      Copy-Item -Path (Join-Path $installedHostX64Bin '*') -Destination $currentHostX64Bin -Recurse -Force
      Copy-Item -Path (Join-Path $currentHostX64Bin '*') -Destination $exactBin -Recurse -Force
      foreach ($installedName in $exactFiles.Keys) {
        $source = Join-Path $qfeRoot $exactFiles[$installedName][0]
        Assert-File $source $exactFiles[$installedName][1]
        Copy-Item -LiteralPath $source -Destination (Join-Path $exactBin $installedName) -Force
      }

      $sevenZip = (Get-Command '7z.exe' -ErrorAction Stop).Source
      $sourceArchive = Join-Path $work 'protobuf-2.6.1.tar.gz'
      Invoke-WebRequest -UseBasicParsing -Uri $env:PROTOBUF_URL -OutFile $sourceArchive
      if ((Get-Item -LiteralPath $sourceArchive).Length -ne [int64]$env:PROTOBUF_SIZE) {
        throw "protobuf archive size mismatch"
      }
      Assert-File $sourceArchive $env:PROTOBUF_SHA256
      # Replay the exact source root embedded in every public 24245 member.
      $sourceExtract = 'C:\Users\mreid\Desktop'
      New-Item -ItemType Directory -Force -Path $sourceExtract | Out-Null
      & $sevenZip x -y "-o$sourceExtract" $sourceArchive | Out-File (Join-Path $output 'protobuf-gzip-extract.log') -Encoding ASCII
      if ($LASTEXITCODE -ne 0) { throw "protobuf gzip extraction failed: $LASTEXITCODE" }
      $sourceTar = Get-ChildItem -LiteralPath $sourceExtract -File -Filter '*.tar' | Select-Object -First 1
      if ($null -eq $sourceTar) { throw "protobuf tar payload missing" }
      & $sevenZip x -y "-o$sourceExtract" $sourceTar.FullName | Out-File (Join-Path $output 'protobuf-tar-extract.log') -Encoding ASCII
      if ($LASTEXITCODE -ne 0) { throw "protobuf tar extraction failed: $LASTEXITCODE" }
      $sourceRoot = Join-Path $sourceExtract 'protobuf-2.6.1'
      Assert-File (Join-Path $sourceRoot 'src\google\protobuf\descriptor.cc') '663b30b849721f0dc589f1e9b9db7b092f9b2d839ad16ad44292fd4646b4cf0d'

      $vcInclude = Join-Path $vcRoot 'include'
      $vcHeaderGates = @{
        'algorithm'     = '674f0dddc61283e68e4f49c6dbb92628c90ac8a0dabb094f59a7d9b1442b4d3b'
        'xutility'      = '20c8f017d72895f5b8c251facc96244b5369bab0cdc7cb43ae14101bbcb5e6a9'
        'vector'        = 'a22d2c4b932d7eb8176070e6f6b17345bbefee627b22d62993a59ffa64b1d0dc'
        'list'          = 'a27587db203af15111db9eb64d3a14d5d065190bc819ddd96713793c750d993c'
        'unordered_map' = '400b5005651b7760be7d02dc193fd5097e74eb32cc14f294cadc6da74a19e38d'
        'xstring'       = '0bec7a1d06de7845e457766311e882a65bb6bd0b32b22aab952f458f5931b6a7'
        'type_traits'   = 'c20abfc0c990d92bd7ab4419b1138c28d3119737abced8e6c1f4f8c8238d0f76'
      }
      foreach ($name in $vcHeaderGates.Keys) {
        Assert-File (Join-Path $vcInclude $name) $vcHeaderGates[$name]
      }

      $ucrtHeaderGates = @{
        'corecrt.h' = '147464f55b954fe5a2033353b95fdf11dbe96274e07baa77d90a6744c94141c6'
        'stdio.h'   = '9dc21bcf6caf69f4d82c6a609801e0ddf4e8e739447da83d3207d36f8ca6878d'
        'stdlib.h'  = '44b607c55c32d5b8ea1d86278e5f7d2daf1849ef5f01c6e06026efd3e6d93e2d'
        'string.h'  = '085e5e11ff47a58d97927a96ff63dce7a66e9fb0d270988369daaac17da6b3a9'
        'math.h'    = '1219188bde640067374ace8119637dc004c7529913f80f26962e834a0895af6c'
        'time.h'    = 'b70a2d9a8b1a89e88dfcce1ccd65c0fc4844bc1ecd2b2936cde66fcc2d422ef5'
      }
      $ucrtMatches = New-Object 'System.Collections.Generic.List[string]'
      $ucrtRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
      foreach ($versionDirectory in @(Get-ChildItem -LiteralPath $ucrtRoot -Directory -ErrorAction Stop)) {
        $candidate = Join-Path $versionDirectory.FullName 'ucrt'
        if (-not (Test-Path -LiteralPath $candidate -PathType Container)) { continue }
        $match = $true
        foreach ($name in $ucrtHeaderGates.Keys) {
          $path = Join-Path $candidate $name
          if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Sha256 $path) -ne $ucrtHeaderGates[$name]) {
            $match = $false
          }
        }
        if ($match) { $ucrtMatches.Add($candidate) }
      }
      if ($ucrtMatches.Count -lt 1) { throw "no installed UCRT header set matches the frozen recipe" }
      $ucrtInclude = @($ucrtMatches | Sort-Object)[0]

      function Capture-Banner([string]$label, [string]$compiler) {
        $stdout = Join-Path $output "$label-banner-stdout.txt"
        $stderr = Join-Path $output "$label-banner-stderr.txt"
        $process = Start-Process -FilePath $compiler -ArgumentList '/?' -NoNewWindow -Wait -PassThru `
          -RedirectStandardOutput $stdout -RedirectStandardError $stderr
        if ($process.ExitCode -ne 0) { throw "$label compiler banner failed: $($process.ExitCode)" }
        $banner = ((Get-Content -LiteralPath $stdout -Raw) + "`n" + (Get-Content -LiteralPath $stderr -Raw))
        $match = [regex]::Match($banner, 'Version\s+([0-9.]+)\s+for\s+([^\s]+)')
        if (-not $match.Success) { throw "$label compiler banner did not parse" }
        return [pscustomobject]@{ version = $match.Groups[1].Value; target = $match.Groups[2].Value }
      }

      function Compile-Descriptor([string]$label, [string]$binDirectory, [string]$expectedVersion) {
        $variant = Join-Path $output $label
        New-Item -ItemType Directory -Force -Path $variant | Out-Null
        $compiler = Join-Path $binDirectory 'cl.exe'
        $identity = Capture-Banner $label $compiler
        $normalizedBanner = (($identity.version.Split('.') | ForEach-Object { [int]$_ }) -join '.')
        if ($normalizedBanner -ne $expectedVersion -or $identity.target -ne 'x86') {
          throw "$label unexpected compiler identity: $($identity.version) for $($identity.target)"
        }
        $pdb = Join-Path $variant 'libprotobuf.pdb'
        $object = Join-Path $variant 'descriptor.obj'
        $rsp = Join-Path $variant 'descriptor.rsp'
        $arguments = @(
          '/c',
          '/X',
          "/I`"$sourceRoot\src`"",
          "/I`"$sourceRoot\vsprojects`"",
          "/I`"$vcInclude`"",
          "/I`"$ucrtInclude`"",
          '/nologo',
          '/W3',
          '/WX-',
          '/O2',
          '/Ob2',
          '/D WIN32',
          '/D NDEBUG',
          '/D _WINDOWS',
          '/D _USRDLL',
          '/D LIBPROTOBUF_EXPORTS',
          '/D _MBCS',
          '/D _SILENCE_STDEXT_HASH_DEPRECATION_WARNINGS',
          '/D _ALLOW_RUNTIME_LIBRARY_MISMATCH',
          '/GF',
          '/Gm-',
          '/EHsc',
          '/MT',
          '/GS',
          '/Gy',
          '/fp:precise',
          '/Zc:wchar_t',
          '/Zc:forScope',
          '/Zc:inline',
          '/GR',
          '/Zi',
          "/Fd`"$pdb`"",
          "/Fo`"$object`"",
          '/Gd',
          '/TP',
          '/wd4244',
          '/wd4267',
          '/wd4018',
          '/wd4355',
          '/wd4800',
          '/wd4251',
          '/wd4996',
          '/wd4146',
          '/wd4305',
          "`"$sourceRoot\src\google\protobuf\descriptor.cc`""
        )
        [System.IO.File]::WriteAllLines($rsp, $arguments, [System.Text.Encoding]::ASCII)
        $stdout = Join-Path $variant 'descriptor-compile.stdout.txt'
        $stderr = Join-Path $variant 'descriptor-compile.stderr.txt'
        $process = Start-Process -FilePath $compiler -ArgumentList "@$rsp" -WorkingDirectory $binDirectory `
          -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
        $process.ExitCode | Set-Content -LiteralPath (Join-Path $variant 'descriptor-compile.exit') -Encoding ASCII
        if ($process.ExitCode -ne 0) { throw "$label descriptor compile failed: $($process.ExitCode)" }
        if ((Get-Item -LiteralPath $object).Length -le 0) { throw "$label descriptor object is empty" }

        $compile3 = Join-Path $variant 'compile3.json'
        $compile3Stderr = Join-Path $variant 'compile3.stderr.txt'
        $python = (Get-Command 'python.exe' -ErrorAction Stop).Source
        $parseProcess = Start-Process -FilePath $python -ArgumentList @("`"$(Join-Path $buildRoot 'parse_compile3.py')`"", "`"$object`"") `
          -NoNewWindow -Wait -PassThru -RedirectStandardOutput $compile3 -RedirectStandardError $compile3Stderr
        if ($parseProcess.ExitCode -ne 0) {
          Get-Content -LiteralPath $compile3, $compile3Stderr | Write-Host
          throw "$label S_COMPILE3 parse failed: $($parseProcess.ExitCode)"
        }
        $compileRows = @(Get-Content -LiteralPath $compile3 -Raw | ConvertFrom-Json)
        if ($compileRows.Count -ne 1 -or $compileRows[0].frontend -ne $expectedVersion -or $compileRows[0].backend -ne $expectedVersion) {
          throw "$label S_COMPILE3 mismatch"
        }

        $fileRows = foreach ($name in @('cl.exe', 'c1.dll', 'c1xx.dll', 'c2.dll')) {
          $path = Join-Path $binDirectory $name
          [pscustomobject]@{ name = $name; size = (Get-Item -LiteralPath $path).Length; sha256 = Get-Sha256 $path }
        }
        [pscustomobject]@{
          label = $label
          banner_version = $identity.version
          target = $identity.target
          object_size = (Get-Item -LiteralPath $object).Length
          object_sha256 = Get-Sha256 $object
          pdb_size = (Get-Item -LiteralPath $pdb).Length
          pdb_sha256 = Get-Sha256 $pdb
          compiler_files = @($fileRows)
          compile3 = @($compileRows)
        } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $variant 'identity.json') -Encoding UTF8
      }

      $projectEvidence = Join-Path $output 'converted-project-evidence'
      New-Item -ItemType Directory -Force -Path $projectEvidence | Out-Null
      $originalVcproj = Join-Path $sourceRoot 'vsprojects\libprotobuf.vcproj'
      Assert-File $originalVcproj '4115cd6bc92568a79391fe35eafde1228b95281103826ebf9e2c2d18f4bcaef3'
      $devenv = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio 14.0\Common7\IDE\devenv.com'
      Assert-File $devenv (Get-Sha256 $devenv)
      $upgradeStdout = Join-Path $projectEvidence 'devenv-upgrade.stdout.txt'
      $upgradeStderr = Join-Path $projectEvidence 'devenv-upgrade.stderr.txt'
      $upgradeProcess = Start-Process -FilePath $devenv -ArgumentList @("`"$originalVcproj`"", '/Upgrade') `
        -NoNewWindow -Wait -PassThru -RedirectStandardOutput $upgradeStdout -RedirectStandardError $upgradeStderr
      if ($upgradeProcess.ExitCode -ne 0) {
        Get-Content -LiteralPath $upgradeStdout, $upgradeStderr | Write-Host
        throw "VS2015 vcproj conversion failed: $($upgradeProcess.ExitCode)"
      }

      $convertedVcxproj = Join-Path $sourceRoot 'vsprojects\libprotobuf.vcxproj'
      if (-not (Test-Path -LiteralPath $convertedVcxproj -PathType Leaf)) {
        throw "VS2015 conversion did not create libprotobuf.vcxproj"
      }
      $convertedHash = Get-Sha256 $convertedVcxproj
      Copy-Item -LiteralPath $convertedVcxproj -Destination (Join-Path $projectEvidence 'libprotobuf.converted-full.vcxproj')

      [xml]$projectXml = Get-Content -LiteralPath $convertedVcxproj -Raw
      $namespace = New-Object System.Xml.XmlNamespaceManager($projectXml.NameTable)
      $namespace.AddNamespace('m', 'http://schemas.microsoft.com/developer/msbuild/2003')
      $compileNodes = @($projectXml.SelectNodes('//m:ClCompile[@Include]', $namespace))
      $descriptorNodes = @($compileNodes | Where-Object {
        (($_.Include -replace '/', '\').ToLowerInvariant()) -eq '..\src\google\protobuf\descriptor.cc'
      })
      if ($descriptorNodes.Count -ne 1) {
        throw "converted project expected one descriptor.cc item, found $($descriptorNodes.Count)"
      }
      $releaseRuntime = $projectXml.SelectSingleNode("//m:ItemDefinitionGroup[@Condition=`"'`$(Configuration)|`$(Platform)'=='Release|Win32'`"]//m:ClCompile/m:RuntimeLibrary", $namespace)
      if ($null -eq $releaseRuntime -or $releaseRuntime.InnerText -ne 'MultiThreadedDLL') {
        throw "converted project Release runtime was not the expected MultiThreadedDLL default"
      }
      # The public object's directives prove this local project override even
      # though the committed upstream vcproj still names the DLL runtime.
      $releaseRuntime.InnerText = 'MultiThreaded'
      $releaseCompile = $projectXml.SelectSingleNode("//m:ItemDefinitionGroup[@Condition=`"'`$(Configuration)|`$(Platform)'=='Release|Win32'`"]//m:ClCompile", $namespace)
      if ($null -eq $releaseCompile) {
        throw "converted project Release ClCompile defaults missing"
      }
      $compatibilityDefines = $releaseCompile.SelectSingleNode('m:PreprocessorDefinitions', $namespace)
      if ($null -eq $compatibilityDefines -or $compatibilityDefines.InnerText -match '_SILENCE_STDEXT_HASH_DEPRECATION_WARNINGS') {
        throw "converted project Release preprocessor defaults unexpected"
      }
      $compatibilityDefines.InnerText = '_SILENCE_STDEXT_HASH_DEPRECATION_WARNINGS;' + $compatibilityDefines.InnerText
      $xmlSettings = New-Object System.Xml.XmlWriterSettings
      $xmlSettings.Encoding = New-Object System.Text.UTF8Encoding($false)
      $xmlSettings.Indent = $true
      $xmlWriter = [System.Xml.XmlWriter]::Create($convertedVcxproj, $xmlSettings)
      try { $projectXml.Save($xmlWriter) } finally { $xmlWriter.Dispose() }
      $staticFullHash = Get-Sha256 $convertedVcxproj
      Copy-Item -LiteralPath $convertedVcxproj -Destination (Join-Path $projectEvidence 'libprotobuf.static-runtime-full.vcxproj')

      $msbuild = Join-Path ${env:ProgramFiles(x86)} 'MSBuild\14.0\Bin\MSBuild.exe'
      if (-not (Test-Path -LiteralPath $msbuild -PathType Leaf)) { throw "MSBuild 14 missing: $msbuild" }

      foreach ($name in @('cl.exe', 'c1.dll', 'c1xx.dll', 'c2.dll', 'link.exe')) {
        Assert-File (Join-Path $exactBin $name) $exactFiles[$name][1]
      }

      $stockHeaderGates = @{
        'repeated_field.h' = 'b15dd8797f4af9276dd03b94f41cbb3181a3cceb7af5ca3b099bca86a635c262'
        'wire_format_lite_inl.h' = '8a6234b5e75fda033ef2febe68d879ca577bcd22c77120655b58ec4f05b2e1ea'
      }
      $valveHeaderGates = @{
        'repeated_field.h' = '0c5b73fb94efea6339aae1b672fd2725f8c57b8553311327d1d6c839eae1a49a'
        'wire_format_lite_inl.h' = '412ece09b6b188552c29fae786b009e4ee7a0845a56ff409ef959e6a7ffa5fbe'
      }
      $valveHeaderRoot = Join-Path $work 'valve-public-headers'
      New-Item -ItemType Directory -Force -Path $valveHeaderRoot | Out-Null
      foreach ($name in @('repeated_field.h', 'wire_format_lite_inl.h')) {
        $uri = "https://raw.githubusercontent.com/ValveSoftware/source-sdk-2013/$($env:VALVE_SOURCE_COMMIT)/src/thirdparty/protobuf-2.6.1/src/google/protobuf/$name"
        $destination = Join-Path $valveHeaderRoot $name
        Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $destination
        Assert-File $destination $valveHeaderGates[$name]
      }

      foreach ($name in @('repeated_field.h', 'wire_format_lite_inl.h')) {
        Copy-Item -LiteralPath (Join-Path $valveHeaderRoot $name) -Destination (Join-Path $sourceRoot "src\google\protobuf\$name") -Force
        Assert-File (Join-Path $sourceRoot "src\google\protobuf\$name") $valveHeaderGates[$name]
      }

      $label = 'exact24215-hostx64-valve-mt-full-archive'
      $variant = Join-Path $output $label
      $intermediate = Join-Path $sourceRoot 'vsprojects\Release'
      if (Test-Path -LiteralPath $intermediate) {
        $expectedIntermediate = (Join-Path $sourceRoot 'vsprojects\Release').ToLowerInvariant()
        if ($intermediate.ToLowerInvariant() -ne $expectedIntermediate) {
          throw "refusing to clean unexpected intermediate directory: $intermediate"
        }
        Remove-Item -LiteralPath $intermediate -Recurse -Force
      }
      New-Item -ItemType Directory -Force -Path $variant | Out-Null

      $compilerIdentity = Capture-Banner $label (Join-Path $exactBin 'cl.exe')
      $normalizedBanner = (($compilerIdentity.version.Split('.') | ForEach-Object { [int]$_ }) -join '.')
      if ($normalizedBanner -ne '19.0.24215.1' -or $compilerIdentity.target -ne 'x86') {
        throw "$label unexpected compiler identity: $($compilerIdentity.version) for $($compilerIdentity.target)"
      }

      $msbuildStdout = Join-Path $variant 'msbuild.stdout.txt'
      $msbuildStderr = Join-Path $variant 'msbuild.stderr.txt'
      $msbuildDiagnostic = Join-Path $variant 'msbuild-diagnostic.log'
      $msbuildArguments = @(
        "`"$convertedVcxproj`"",
        '/nologo',
        '/m:1',
        '/t:Rebuild',
        '/p:Configuration=Release',
        '/p:Platform=Win32',
        '/p:PlatformToolset=v140',
        '/p:PreferredToolArchitecture=x64',
        "/p:CLToolPath=$exactBin",
        '/p:CLToolExe=cl.exe',
        "/p:LibToolPath=$exactBin",
        '/p:LibToolExe=lib.exe',
        '/p:TrackFileAccess=false',
        '/v:diag',
        '/fl',
        "/flp:logfile=$msbuildDiagnostic;verbosity=diagnostic"
      )
      [System.IO.File]::WriteAllLines((Join-Path $variant 'msbuild.args.txt'), $msbuildArguments, [System.Text.Encoding]::ASCII)
      $msbuildProcess = Start-Process -FilePath $msbuild -ArgumentList $msbuildArguments `
        -WorkingDirectory (Split-Path -Parent $convertedVcxproj) -NoNewWindow -Wait -PassThru `
        -RedirectStandardOutput $msbuildStdout -RedirectStandardError $msbuildStderr
      $msbuildProcess.ExitCode | Set-Content -LiteralPath (Join-Path $variant 'msbuild.exit') -Encoding ASCII
      if ($msbuildProcess.ExitCode -ne 0) {
        Get-Content -LiteralPath $msbuildStdout, $msbuildStderr | Select-Object -Last 240 | Write-Host
        throw "$label converted vcproj full archive build failed: $($msbuildProcess.ExitCode)"
      }

      $builtArchive = Join-Path $intermediate 'libprotobuf.lib'
      if (-not (Test-Path -LiteralPath $builtArchive -PathType Leaf) -or (Get-Item -LiteralPath $builtArchive).Length -le 0) {
        throw "$label output archive missing or empty: $builtArchive"
      }
      $objects = @(Get-ChildItem -LiteralPath $intermediate -File -Filter '*.obj')
      if ($objects.Count -ne 34) {
        throw "$label expected 34 objects, found $($objects.Count)"
      }

      $expectedArchiveOrder = @(
        'wire_format_lite.obj',
        'wire_format.obj',
        'unknown_field_set.obj',
        'text_format.obj',
        'substitute.obj',
        'strutil.obj',
        'structurally_valid.obj',
        'stringprintf.obj',
        'once.obj',
        'common.obj',
        'atomicops_internals_x86_msvc.obj',
        'service.obj',
        'repeated_field.obj',
        'reflection_ops.obj',
        'message_lite.obj',
        'message.obj',
        'zero_copy_stream_impl_lite.obj',
        'zero_copy_stream_impl.obj',
        'zero_copy_stream.obj',
        'tokenizer.obj',
        'strtod.obj',
        'printer.obj',
        'gzip_stream.obj',
        'coded_stream.obj',
        'generated_message_util.obj',
        'generated_message_reflection.obj',
        'extension_set_heavy.obj',
        'extension_set.obj',
        'dynamic_message.obj',
        'descriptor_database.obj',
        'descriptor.pb.obj',
        'descriptor.obj',
        'parser.obj',
        'importer.obj'
      )
      $objectNames = @($objects | ForEach-Object { $_.Name.ToLowerInvariant() } | Sort-Object)
      $expectedNames = @($expectedArchiveOrder | ForEach-Object { $_.ToLowerInvariant() } | Sort-Object)
      if (($objectNames -join "`n") -ne ($expectedNames -join "`n")) {
        throw "$label object membership differs from frozen 34-member set"
      }

      $librarian = Join-Path $exactBin 'lib.exe'
      if (-not (Test-Path -LiteralPath $librarian -PathType Leaf)) { throw "librarian missing: $librarian" }

      $nativeArchiveSize = (Get-Item -LiteralPath $builtArchive).Length
      $nativeArchiveHash = Get-Sha256 $builtArchive
      $nativeListStdout = Join-Path $variant 'msbuild-native-lib-list.stdout.txt'
      $nativeListStderr = Join-Path $variant 'msbuild-native-lib-list.stderr.txt'
      $nativeListProcess = Start-Process -FilePath $librarian -ArgumentList @('/nologo', '/list', "`"$builtArchive`"") `
        -NoNewWindow -Wait -PassThru -RedirectStandardOutput $nativeListStdout -RedirectStandardError $nativeListStderr
      if ($nativeListProcess.ExitCode -ne 0) {
        Get-Content -LiteralPath $nativeListStdout, $nativeListStderr | Write-Host
        throw "$label native librarian member listing failed: $($nativeListProcess.ExitCode)"
      }
      $nativeArchiveOrder = @(Get-Content -LiteralPath $nativeListStdout | Where-Object { $_.Trim().ToLowerInvariant().EndsWith('.obj') } | ForEach-Object { [System.IO.Path]::GetFileName($_.Trim()) })
      if ($nativeArchiveOrder.Count -ne 34) { throw "$label native archive did not contain 34 members" }
      [System.IO.File]::WriteAllLines((Join-Path $variant 'msbuild-native-archive-order.txt'), $nativeArchiveOrder, [System.Text.Encoding]::ASCII)

      # VS2015 conversion enumerates the original vcproj items in forward
      # order, while both the checked Win64 archive and public Win32 witness
      # preserve the exact reverse order.  Replay that frozen order explicitly.
      $archive = Join-Path $variant 'libprotobuf.lib'
      $orderedObjectPaths = @()
      foreach ($name in $expectedArchiveOrder) {
        $match = @($objects | Where-Object { $_.Name -ieq $name })
        if ($match.Count -ne 1) { throw "$label could not resolve ordered object $name" }
        $orderedObjectPaths += $match[0].FullName
      }
      $orderedRsp = Join-Path $variant 'ordered-lib.rsp'
      $orderedRspLines = @('/nologo', "/out:`"$archive`"") + @($orderedObjectPaths | ForEach-Object { "`"$_`"" })
      [System.IO.File]::WriteAllLines($orderedRsp, $orderedRspLines, [System.Text.Encoding]::ASCII)
      $orderedLibStdout = Join-Path $variant 'ordered-lib.stdout.txt'
      $orderedLibStderr = Join-Path $variant 'ordered-lib.stderr.txt'
      & $librarian ("@" + $orderedRsp) 1> $orderedLibStdout 2> $orderedLibStderr
      if ($LASTEXITCODE -ne 0) {
        Get-Content -LiteralPath $orderedLibStdout, $orderedLibStderr | Write-Host
        throw "$label ordered librarian build failed: $LASTEXITCODE"
      }
      if (-not (Test-Path -LiteralPath $archive -PathType Leaf) -or (Get-Item -LiteralPath $archive).Length -le 0) {
        throw "$label ordered archive missing or empty"
      }

      $listStdout = Join-Path $variant 'lib-list.stdout.txt'
      $listStderr = Join-Path $variant 'lib-list.stderr.txt'
      $listProcess = Start-Process -FilePath $librarian -ArgumentList @('/nologo', '/list', "`"$archive`"") `
        -NoNewWindow -Wait -PassThru -RedirectStandardOutput $listStdout -RedirectStandardError $listStderr
      if ($listProcess.ExitCode -ne 0) {
        Get-Content -LiteralPath $listStdout, $listStderr | Write-Host
        throw "$label librarian member listing failed: $($listProcess.ExitCode)"
      }
      $actualArchiveOrder = @(Get-Content -LiteralPath $listStdout | Where-Object { $_.Trim().ToLowerInvariant().EndsWith('.obj') } | ForEach-Object { [System.IO.Path]::GetFileName($_.Trim()) })
      if ($actualArchiveOrder.Count -ne $expectedArchiveOrder.Count) {
        throw "$label archive member count mismatch: expected=$($expectedArchiveOrder.Count) actual=$($actualArchiveOrder.Count)"
      }
      for ($index = 0; $index -lt $expectedArchiveOrder.Count; $index++) {
        if ($actualArchiveOrder[$index].ToLowerInvariant() -ne $expectedArchiveOrder[$index].ToLowerInvariant()) {
          throw "$label archive order mismatch at $index expected=$($expectedArchiveOrder[$index]) actual=$($actualArchiveOrder[$index])"
        }
      }
      [System.IO.File]::WriteAllLines((Join-Path $variant 'expected-archive-order.txt'), $expectedArchiveOrder, [System.Text.Encoding]::ASCII)
      [System.IO.File]::WriteAllLines((Join-Path $variant 'actual-archive-order.txt'), $actualArchiveOrder, [System.Text.Encoding]::ASCII)

      $python = (Get-Command 'python.exe' -ErrorAction Stop).Source
      $compile3Rows = @()
      foreach ($object in @($objects | Sort-Object Name)) {
        $compile3 = Join-Path $work "$($object.BaseName)-compile3.json"
        $compile3Stderr = Join-Path $work "$($object.BaseName)-compile3.stderr.txt"
        $parseProcess = Start-Process -FilePath $python -ArgumentList @("`"$(Join-Path $buildRoot 'parse_compile3.py')`"", "`"$($object.FullName)`"") `
          -NoNewWindow -Wait -PassThru -RedirectStandardOutput $compile3 -RedirectStandardError $compile3Stderr
        if ($parseProcess.ExitCode -ne 0) {
          Get-Content -LiteralPath $compile3, $compile3Stderr | Write-Host
          throw "$label S_COMPILE3 parse failed for $($object.Name): $($parseProcess.ExitCode)"
        }
        $rows = @(Get-Content -LiteralPath $compile3 -Raw | ConvertFrom-Json)
        if ($rows.Count -ne 1 -or $rows[0].frontend -ne '19.0.24215.1' -or $rows[0].backend -ne '19.0.24215.1') {
          throw "$label S_COMPILE3 mismatch for $($object.Name)"
        }
        $compile3Rows += [pscustomobject]@{
          member = $object.Name
          size = $object.Length
          sha256 = Get-Sha256 $object.FullName
          frontend = $rows[0].frontend
          backend = $rows[0].backend
          machine = $rows[0].machine
          version_name = $rows[0].version_name
        }
      }
      @($compile3Rows) | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $variant 'compile3-all.json') -Encoding UTF8
      @($objects | Sort-Object Name | ForEach-Object { "$($_.Name)`t$($_.Length)`t$(Get-Sha256 $_.FullName)" }) |
        Set-Content -LiteralPath (Join-Path $variant 'object-manifest.tsv') -Encoding ASCII

      $projectDirectory = Split-Path -Parent $convertedVcxproj
      $compileItemRows = @()
      for ($index = 0; $index -lt $compileNodes.Count; $index++) {
        $sourcePath = (Get-Item -LiteralPath (Join-Path $projectDirectory $compileNodes[$index].Include)).FullName
        $compileItemRows += "$($index + 1)`t$($compileNodes[$index].Include)`t$((Get-Item -LiteralPath $sourcePath).Length)`t$(Get-Sha256 $sourcePath)"
      }
      [System.IO.File]::WriteAllLines((Join-Path $variant 'project-compile-items.tsv'), $compileItemRows, [System.Text.Encoding]::ASCII)

      $sourcePrefix = $sourceRoot.TrimEnd('\') + '\'
      $sourceRows = @(Get-ChildItem -LiteralPath (Join-Path $sourceRoot 'src') -Recurse -File | Sort-Object FullName | ForEach-Object {
        "$($_.FullName.Substring($sourcePrefix.Length))`t$($_.Length)`t$(Get-Sha256 $_.FullName)"
      })
      [System.IO.File]::WriteAllLines((Join-Path $variant 'source-tree-manifest.tsv'), $sourceRows, [System.Text.Encoding]::ASCII)

      $compilerFiles = foreach ($name in @('cl.exe', 'c1.dll', 'c1xx.dll', 'c2.dll', 'link.exe', 'lib.exe')) {
        $path = Join-Path $exactBin $name
        [pscustomobject]@{ name = $name; size = (Get-Item -LiteralPath $path).Length; sha256 = Get-Sha256 $path }
      }
      [pscustomobject]@{
        label = $label
        source_kind = 'Valve public libprotobuf closure: pinned upstream 2.6.1 plus two hash-pinned Valve headers'
        source_root = $sourceRoot
        source_descriptor_sha256 = Get-Sha256 (Join-Path $sourceRoot 'src\google\protobuf\descriptor.cc')
        source_header_sha256 = @{
          'repeated_field.h' = Get-Sha256 (Join-Path $sourceRoot 'src\google\protobuf\repeated_field.h')
          'wire_format_lite_inl.h' = Get-Sha256 (Join-Path $sourceRoot 'src\google\protobuf\wire_format_lite_inl.h')
        }
        valve_source_commit = $env:VALVE_SOURCE_COMMIT
        runtime_library = 'MultiThreaded'
        compatibility_defines = @('_SILENCE_STDEXT_HASH_DEPRECATION_WARNINGS')
        source_root_matches_public_object = $true
        banner_version = $compilerIdentity.version
        target = $compilerIdentity.target
        source_vcproj_sha256 = Get-Sha256 $originalVcproj
        converted_full_vcxproj_sha256 = $convertedHash
        static_runtime_full_vcxproj_sha256 = $staticFullHash
        converted_compile_items = $compileNodes.Count
        archive_member_count = $actualArchiveOrder.Count
        archive_member_order = @($actualArchiveOrder)
        archive_size = (Get-Item -LiteralPath $archive).Length
        archive_sha256 = Get-Sha256 $archive
        msbuild_native_archive_size = $nativeArchiveSize
        msbuild_native_archive_sha256 = $nativeArchiveHash
        msbuild_native_archive_order = @($nativeArchiveOrder)
        ordered_archive_replay = $true
        compile3_verified_members = $compile3Rows.Count
        compiler_files = @($compilerFiles)
        devenv_path = $devenv
        devenv_sha256 = Get-Sha256 $devenv
        msbuild_path = $msbuild
        msbuild_sha256 = Get-Sha256 $msbuild
      } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $variant 'identity.json') -Encoding UTF8

      Get-ChildItem -LiteralPath $output -Recurse -File -Filter '*.pdb' | Remove-Item -Force

      [pscustomobject]@{
        image = $env:APPVEYOR_BUILD_WORKER_IMAGE
        build_id = $env:APPVEYOR_BUILD_ID
        job_id = $env:APPVEYOR_JOB_ID
        commit = $env:APPVEYOR_REPO_COMMIT
        protobuf_url = $env:PROTOBUF_URL
        protobuf_size = (Get-Item -LiteralPath $sourceArchive).Length
        protobuf_sha256 = Get-Sha256 $sourceArchive
        source_root = $sourceRoot
        observed_public_object_root = 'C:\Users\mreid\Desktop\protobuf-2.6.1\vsprojects\Release'
        observed_public_runtime = 'MultiThreaded'
        valve_source_commit = $env:VALVE_SOURCE_COMMIT
        valve_source_repository = 'https://github.com/ValveSoftware/source-sdk-2013'
        msp_path = $msp.FullName
        msp_size = $msp.Length
        msp_sha256 = Get-Sha256 $msp.FullName
        vc_include = $vcInclude
        ucrt_include = $ucrtInclude
        ucrt_matching_sets = @($ucrtMatches)
      } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $output 'provenance.json') -Encoding UTF8

      $outputPrefix = $output.TrimEnd('\') + '\'
      Get-ChildItem -LiteralPath $output -Recurse -File |
        Sort-Object FullName |
        ForEach-Object {
          $relative = $_.FullName.Substring($outputPrefix.Length)
          "$relative`t$($_.Length)`t$(Get-Sha256 $_.FullName)"
        } | Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS.tsv') -Encoding ASCII

artifacts:
